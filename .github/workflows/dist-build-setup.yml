- name: Install Zig
  uses: mlugg/setup-zig@v2
  with:
    version: 0.15.2
- name: Cache Zig
  uses: actions/cache@v4
  with:
    path: vendor/libghostty-vt/.zig-cache
    key: zig-${{ runner.os }}-${{ join(matrix.targets, '-') }}-${{ hashFiles('vendor/libghostty-vt/build.zig.zon', 'vendor/libghostty-vt/VERSION') }}
