# Build the native `Kumo-<arch>.dmg` for the desktop app and attach it to its
# release. Runs whenever a release is published (stable tags and the recreated
# `nightly` release), because cargo-dist cannot produce `.dmg` artifacts itself
# (its `extra_artifacts` are literal paths shared across a target's build jobs,
# which would collide between the two macOS architectures).
#
# The desktop app's in-app updater downloads the matching `Kumo-<arch>.dmg`
# asset from this release to self-update, so the asset name must stay stable.
#
# The x86_64 job skips itself when the nightly (2-target default matrix) does
# not produce an Intel desktop build.

name: Desktop DMG

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    name: dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Skip if this arch has no desktop build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ASSET=$(gh release view "$TAG" --json assets --jq -r '.assets[].name' | \
            grep "kumo-desktop-.*-${{ matrix.target }}.tar.xz" | head -1 || true)
          if [ -z "$ASSET" ]; then
            echo "no kumo-desktop archive for ${{ matrix.target }} on this release; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the kumo-desktop archive
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "${{ steps.check.outputs.asset }}" --dir .
          tar -xf "${{ steps.check.outputs.asset }}"
      - name: Build the dmg
        if: steps.check.outputs.skip != 'true'
        run: |
          BIN=$(find . -maxdepth 3 -type f -name kumo-desktop -perm -111 | head -1)
          VERSION=$(basename "${{ steps.check.outputs.asset }}" | sed -E 's/kumo-desktop-([0-9.]+).*/\1/')
          ./ci/desktop-dmg.sh "$BIN" "$VERSION"
      - name: Upload the dmg to the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/Kumo-${{ matrix.arch }}.dmg" --clobber
