[package]
name = "neomux"
version = "0.1.0"
description = "Neomux terminal multiplexer with Claude AI integration"
authors = ["neomux"]
edition = "2021"

[dependencies]
neomux-core = { path = "../neomux-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

[lib]
name = "neomux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
