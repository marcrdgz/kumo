[package]
name = "neomux-tui"
version.workspace = true
edition.workspace = true
description = "Neomux TUI (ratatui) frontend with mouse support"

[dependencies]
neomux-core = { path = "../neomux-core" }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.8"
alacritty_terminal = { version = "0.26", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
