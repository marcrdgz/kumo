[package]
name = "kumo-desktop"
version.workspace = true
edition.workspace = true
description = "Native desktop client for the kumo daemon (GPUI): full-attach grid viewer + sessions/agents sidebar"

[[bin]]
name = "kumo-desktop"
path = "src/main.rs"

[dependencies]
kumo-protocol = { path = "../../crates/kumo-protocol" }
# runtime_shaders compiles the Metal shaders at runtime, so the app builds
# without full Xcode (only Command Line Tools with the Metal runtime).
gpui = { version = "0.2", features = ["runtime_shaders"] }
anyhow = "1"
libc = "0.2"
