<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neomux</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="statusbar">
      <span id="status-left"></span>
      <div id="search-bar" role="search">
        <svg
          class="search-icon"
          viewBox="0 0 16 16"
          width="12"
          height="12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        >
          <circle cx="7" cy="7" r="5" />
          <line x1="11" y1="11" x2="14" y2="14" />
        </svg>
        <input
          id="search-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="search scrollback…"
        />
        <span class="search-hint">↩ next · ⇧↩ prev · esc close</span>
      </div>
      <span id="status-right"></span>
    </div>
    <div id="app">
      <aside id="sidebar">
        <div id="session-list"></div>
        <div id="git-section">
          <div id="git-header">
            <span id="git-branch">—</span>
            <span id="git-meta"></span>
            <button id="git-refresh">↻</button>
          </div>
          <div id="git-body"></div>
        </div>
      </aside>
      <div id="workspace"></div>
    </div>
    <div id="welcome" class="hidden">
      <div class="welcome-card">
        <div class="welcome-title">neomux</div>
        <div class="welcome-subtitle">Terminal multiplexer with AI</div>
        <button id="open-folder-btn" class="welcome-btn">Open Folder…</button>
        <div id="recent-list" class="hidden">
          <div class="recent-label">Recent</div>
          <div id="recent-items"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
