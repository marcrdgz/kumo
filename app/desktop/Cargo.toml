[package]
name = "kumo-desktop"
version.workspace = true
edition.workspace = true
description = "Native desktop client for the kumo daemon (GPUI): full-attach grid viewer + sessions/agents sidebar"
repository = "https://github.com/marcrdgz/kumo"

# The desktop app is not deployed yet: it stays in the workspace (so it keeps
# building locally) but `dist = false` keeps it out of releases entirely — no
# artifacts, installers, or announcement until it is useful enough to ship.
[package.metadata.dist]
repository = "https://github.com/marcrdgz/kumo"
dist = false

# Likewise, cargo-release ignores the desktop app: it ships separately (its own
# `Kumo-<arch>.dmg`), never through the `kumo` version releases.
[package.metadata.release]
release = false

[[bin]]
name = "kumo-desktop"
path = "src/main.rs"

[dependencies]
kumo-core = { path = "../../crates/kumo-core" }
kumo-protocol = { path = "../../crates/kumo-protocol" }
# runtime_shaders compiles the Metal shaders at runtime, so the app builds
# without full Xcode (only Command Line Tools with the Metal runtime).
gpui = { version = "0.2", features = ["runtime_shaders"] }
anyhow = "1"
libc = "0.2"
# Frameless titlebar drag: gpui 0.2's WindowControlArea::Drag / start_window_move
# are no-ops on macOS, so the titlebar strip hands the drag to AppKit directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

