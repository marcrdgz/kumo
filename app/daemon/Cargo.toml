[package]
name = "kumo-daemon"
version.workspace = true
edition.workspace = true
description = "Headless kumo daemon: owns the PTYs, terminal emulators, and semantic layout, served over the unix socket"
build = "build.rs"

[[bin]]
name = "kumo-daemon"
path = "src/main.rs"

[dependencies]
kumo-core = { path = "../../crates/kumo-core" }
kumo-protocol = { path = "../../crates/kumo-protocol", features = ["crossterm"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
anyhow = "1"
log = "0.4"
libc = "0.2"
