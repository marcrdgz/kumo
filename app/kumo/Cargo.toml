[package]
name = "kumo"
version.workspace = true
edition.workspace = true
description = "Kumo terminal multiplexer: daemon + TUI + control CLI in one binary (run `kumo daemon` for the headless server)"
repository = "https://github.com/marcrdgz/kumo"
build = "build.rs"

[[bin]]
name = "kumo"
path = "src/main.rs"

[dependencies]
kumo-core = { path = "../../crates/kumo-core" }
kumo-protocol = { path = "../../crates/kumo-protocol", features = ["crossterm"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
anyhow = "1"
log = "0.4"
libc = "0.2"

[package.metadata.dist]
repository = "https://github.com/marcrdgz/kumo"

