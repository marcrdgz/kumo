# SWE-agent CLI lifecycle detection. Non-interactive runs normally expose only
# a working marker and become done when the process exits.
[agent]
id = "swe"

[[blocked]]
tests = [{ region = "footer", contains-any = [
  "waiting for approval",
  "confirm to continue",
  "do you want to proceed?",
] }]

[[working]]
tests = [{ region = "title", spinner = "braille" }]
[[working]]
tests = [{ region = "footer", contains-any = [
  "esc to interrupt",
  "ctrl-c to interrupt",
  "press esc to cancel",
] }]

[[idle]]
tests = [{ region = "footer", contains-any = [
  "enter a prompt",
  "swe-agent>",
] }]
