# Aider is primarily line-oriented. Restrict all signals to the live footer so
# commands or questions retained in its transcript do not become stale state.
[agent]
id = "aider"
# Reopens the last conversation when kumo restores the pane after a reboot.
resume = ["aider", "--restore-chat-history"]

[[blocked]]
tests = [{ region = "footer", contains-any = [
  "allow this command?",
  "run shell command?",
  "add it to the chat?",
] }]

[[working]]
tests = [{ region = "title", spinner = "braille" }]
[[working]]
tests = [{ region = "footer", contains-any = [
  "ctrl-c to interrupt",
  "esc to interrupt",
  "waiting for",
] }]

[[idle]]
tests = [{ region = "footer", contains-any = [
  "ask for changes",
  "aider>",
] }]
