# Codex lifecycle detection rules, adapted from Herdr's published codex.toml.
# User overrides may replace this file in ~/.config/kumo/agent-detection.
#
# Blocked detection is restricted to the live terminal footer. Codex keeps
# conversation text in the screen/form regions, so matching prompt wording
# there can classify quoted text from the transcript as an active question.

[agent]
id = "codex"

# Initial trust prompt. Both phrases are required: output which merely quotes
# either one must not make the pane look blocked. The complete prompt fits in
# the footer while it is active.
[[blocked]]
tests = [
  { region = "footer", contains = "you are in" },
  { region = "footer", contains = "do you trust the contents of this directory?" },
]

# Startup update prompt.
[[blocked]]
tests = [
  { region = "footer", contains = "update available!" },
  { region = "footer", contains = "update now" },
  { region = "footer", contains = "skip until next version" },
  { region = "footer", contains = "press enter to continue" },
]

# Live approval / question footer. These instructions are rendered at the
# bottom only while Codex is waiting for interactive input.
[[blocked]]
tests = [{ region = "footer", contains-any = [
  "press enter to confirm or esc to cancel",
  "enter to submit answer",
  "enter to submit all",
] }]

[[working]]
tests = [{ region = "title", spinner = "braille" }]

[[working]]
tests = [
  { region = "footer", contains-any = ["• working (", "◦ working ("] },
  { region = "footer", contains = "esc to interrupt" },
  { not = [{ region = "screen", contains = "conversation interrupted" }] },
]

# Codex's transcript viewer is not a live prompt. Its title stays non-empty,
# so exclude its chrome before accepting the title-only idle marker. The
# "action required" title alone only means Codex wants attention; without a
# live question footer it is idle, not blocked.
[[idle]]
tests = [
  { region = "title", nonempty = true },
  { not = [{ region = "title", spinner = "braille" }] },
  { not = [
      { region = "screen", contains = "↑/↓ to scroll" },
      { region = "screen", contains = "pgup/pgdn to" },
      { region = "screen", contains = "home/end to jump" },
      { region = "screen", contains = "q to quit" },
      { any-of = [
          { region = "screen", contains = "esc to edit prev" },
          { region = "screen", contains = "esc/← to edit prev" },
      ]},
  ]},
]
