[workspace]
resolver = "2"
members = [
    "crates/kumo-protocol",
    "crates/kumo-core",
    "app/kumo",
    "app/desktop",
]

[workspace.package]
version = "0.5.4"
edition = "2021"
authors = ["Marc Rodríguez <marc@rdgz.es>"]

# cargo-release settings (cargo release)
[workspace.metadata.release]
shared-version = "workspace"
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release {{version}}"
# Regenerate the root CHANGELOG.md from conventional commits before the release
# commit. The hook runs with the released crate's dir (app/kumo) as cwd, so
# anchor to the workspace root.
pre-release-hook = ["sh", "-c", "cd \"$(git rev-parse --show-toplevel)\" && git cliff -o CHANGELOG.md --tag {{tag_name}}"]
allow-branch = ["main"]
publish = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
