[workspace]
resolver = "2"
members = []

[package]
name = "kumo"
version.workspace = true
edition.workspace = true
description = "Kumo TUI (ratatui) frontend with mouse support"
build = "build.rs"
repository = "https://github.com/marcrdgz/kumo"

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
authors = ["Marc Rodríguez <marc@rdgz.es>"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
semver = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
