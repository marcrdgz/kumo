# git-cliff configuration (git-cliff --config cliff.toml)
# The rest of the settings fall back to git-cliff defaults.

# Proper document header for the changelog.
[changelog]
header = "# Changelog\n\n"
# Custom body: identical to the git-cliff default except the version heading
# omits the date and keeps the `v` prefix (`## v0.2.1`). cargo-dist derives the
# GitHub release title from this heading, so the release title becomes exactly
# `v0.2.1` instead of `0.2.1 - 2026-08-11`.
body = """
{% if version %}\
    ## v{{ version | trim_start_matches(pat="v") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespace from the rendered body.
trim = true

# Never treat the rolling `nightly`/`nightly-last` tags as release boundaries;
# those commits belong to the nearest versioned release instead.
[git]
ignore_tags = "nightly*"
# Explicit parsers mirroring git-cliff's built-in defaults, except `docs`
# commits are skipped (internal docs like roadmap/README tweaks don't belong in
# user-facing release notes — feature work is `feat`/`fix`, not docs).
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", skip = true },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
